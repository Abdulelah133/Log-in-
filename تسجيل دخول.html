<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form class="form">
    <table>
      <tr>
        <th colspan="2"> Registration Form </th>

        </td>
      </tr>

      <tr>
        <td>User Name</td>
        <td><input type="text" name="User Name"></td>
      </tr>

      <tr>
        <td>Password</td>
        <td><input type="password" name="password"></td>
      </tr>

      <tr>
        <td>Enter Address</td>
        <td> <input type="text" name="Address"></td>
      </tr>

      <tr>
        <td>Select Job</td>
        <td>
          <input type="checkbox" name="Job" value="Teacher">Teacher<br>
         <input type="checkbox" name="Job" value="Doctor"> Doctor <br>
         <input type="checkbox"name="Job" value="Pilot"> Pilot><br>
          <input type="checkbox"name="Job" value="Engineer"> Engineer
        </td>
      </tr>

      <tr>
        <td> select Gender</td>
        <td>
          <input type="radio" name="Gender" value="Male"> Male
          <input type="radio" name="Gender" value="Female"> Female
        </td>
      </tr>

      <tr>
        <td><label>Select Age</label></td>
        <td>
          <select>
            <option>Select</option>
            <option>18</option>
            <option>19</option>
            <option>20</option>
            <option>21</option>
            <option>22</option>
            <option>23</option>
            <option>24</option>
            <option>25</option>
          </select>
        </td>
      </tr>

      <tr>
        <td><label>Select Photo</label></td>
        <td><input type="file"></td>
      </tr>

      <tr class="buttons">
        <td colspan="2">
         <input class="btn" type="button" value="button">
         <input class="btn" type="reset" value="reset">
         <input class="btn" type="submit" value="submit form">

        </td>
      </tr>
    </table>
  </form>
</body>
</html>
